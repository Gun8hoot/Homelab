
# https://docs.seerr.dev/getting-started/docker/?docker-methods=docker-compose
services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: homelab-seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TIMEZONE}
    ports:
      - ${SEERR_PORT}:${SEERR_PORT}
    volumes:
      - ${VOLUMES_LOCATION}/seerr:/app/config
      # - seerr-data:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - nginx_network
      - network_access
