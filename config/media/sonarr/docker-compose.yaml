---
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: homelab-sonarr
    ports:
      - ${SONARR}:${SONARR}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - ${VOLUMES_LOCATION}/sonarr:/config
      - ${MEDIA_DIRECTORY_LOCATION}/${MEDIA_SHOW_DIRECTORY_NAME}:/tv
    restart: unless-stopped
    networks:
      - nginx_network
      - network_access
