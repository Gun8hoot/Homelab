
# --- proxmox.homelab.lan ---
server {
        listen 443 ssl;
        server_name proxmox.homelab.lan;

        location / {
            proxy_pass https://$proxmox:${PROXMOX_PORT}$request_uri;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        allow 192.168.0.0/16;
        deny all;
}
