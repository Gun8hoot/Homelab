
services:
  nginx:
    container_name: homelab-nginx
    build:
      context: ./
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    restart: unless-stopped
    environment:
      LANDING_IP: ${LANDING_IP}
      JELLYFIN_IP: ${JELLYFIN_IP}
      PROWLARR_IP: ${PROWLARR_IP}
      QBITTORRENT_IP: ${QBITTORRENT_IP}
      RADARR_IP: ${RADARR_IP}
      SEERR_IP: ${SEERR_IP}
      SONARR_IP: ${SONARR_IP}
      KUMA_IP: ${KUMA_IP}
      PIHOLE_IP: ${PIHOLE_IP}
      FORGEJO_IP: ${FORGEJO_IP}
      PROXMOX_IP: ${PROXMOX_IP}
    networks:
      - network_access
      - nginx_network
    volumes:
      - type: bind
        source: ${SSL_CERTIFICATE_LOCATION}
        target: /cert/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SSL_KEY_LOCATION}
        target: /cert/privkey.pem
        read_only: true
        bind:
          create_host_path: false
    command: /bin/bash -c "envsubst '${JELLYFIN_IP}' < /etc/nginx/nginx.template.conf > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    # command: /bin/sh -c "envsubst '${LANDING_IP} ${JELLYFIN_IP} ${PROWLARR_IP} ${QBITTORRENT_IP} ${RADARR_IP} ${SEERR_IP} ${SONARR_IP} ${KUMA_IP} ${PIHOLE_IP} ${FORGEJO_IP} ${PROXMOX_IP}' < /etc/nginx/nginx.template.conf > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
