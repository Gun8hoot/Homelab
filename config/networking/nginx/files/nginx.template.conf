worker_processes auto;

events { worker_connections 1024; }

# stream {
#     server {
#         listen 53 udp;
#         listen 53;
#         proxy_pass pihole:53;
#     }
# }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- LOG ---
    # log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
    #                 '"$http_referer" "$http_user_agent" cf_ray=$http_cf_ray rt=$request_time';
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # --- DEFINING VARIABLES ---
    #map "" $jellyfin { default "${JELLYFIN_IP}"; }
    #map "" $pihole { default "${PIHOLE_IP}"; }
    #map "" $forgejo { default "${FORGEJO_IP}"; }
    #map "" $prowlarr { default "${PROWLARR_IP}"; }
    #map "" $qbittorrent { default "${QBITTORRENT_IP}"; }
    #map "" $radarr { default "${RADARR_IP}"; }
    #map "" $seerr { default "${SEERR_IP}"; }
    #map "" $sonarr { default "${SONARR_IP}"; }
    #map "" $kuma { default "${KUMA_IP}"; }

    #set $jellyfin            "${JELLYFIN_IP}"
    #set $pihole              "${PIHOLE_IP}"
    #set $forgejo             "${FORGEJO_IP}"
    #set $prowlarr            "${PROWLARR_IP}"
    #set $qbittorrent         "${QBITTORRENT_IP}"
    #set $radarr              "${RADARR_IP}"
    #set $seerr               "${SEERR_IP}"
    #set $sonarr              "${SONARR_IP}"
    #set $kuma                "${KUMA_IP}"

    # --- TLS ---
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       on;

    ssl_certificate           /cert/fullchain.pem;
    ssl_certificate_key       /cert/privkey.pem;

    # --- SERVERS ---
    # HTTP
#     server {
#         listen 80 default_server;
#         listen [::]:80 default_server;
#         server_name _;
#         return 444;
#     }
#
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    # server {
    #     listen 443 ssl default_server;
    #     listen [::]:443 ssl default_server;
    #     server_name _;
    # }
    include       /etc/nginx/sites-enabled/*;
}
