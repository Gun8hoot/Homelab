
services:
  nginx:
    container_name: homelab-nginx
    build:
      context: ./
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    restart: unless-stopped
    secrets:
      - fullchain.pem
      - privkey.pem
    networks:
      - internet_access
      - isolated

secrets:
    fullchain.pem:
        file: "../../secrets/fullchain.pem"
    privkey.pem:
        file: "../../secrets/privkey.pem"
